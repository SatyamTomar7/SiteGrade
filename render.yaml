services:
  - type: web
    name: sitegrade-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: PUPPETEER_CACHE_DIR
        value: ./.cache/puppeteer
      - key: PUPPETEER_WAIT_UNTIL
        value: domcontentloaded
      - key: PUPPETEER_NAVIGATION_TIMEOUT_MS
        value: 45000
      - key: CLIENT_URL
        value: https://site-grade.vercel.app
      - key: PUBLIC_APP_URL
        value: https://site-grade.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: GEMINI_API_KEY
        sync: false
      - key: SCREENSHOTS_DIR
        value: ./screenshots
      - key: RUN_ANALYSIS_WORKER_IN_API
        value: true
      - key: RUN_SCHEDULE_WORKER_IN_API
        value: true
      - key: ANALYSIS_RUN_AUDITS_IN_PARALLEL
        value: false
      - key: ANALYSIS_WORKER_CONCURRENCY
        value: 1
      - key: ANALYSIS_QUEUE_ATTEMPTS
        value: 1
      - key: ANALYSIS_JOB_LOCK_DURATION_MS
        value: 600000
      - key: ANALYSIS_JOB_STALLED_INTERVAL_MS
        value: 30000
      - key: ANALYSIS_JOB_MAX_STALLED_COUNT
        value: 2
      - key: ANALYSIS_LINK_CHECK_CONCURRENCY
        value: 4
      - key: LIGHTHOUSE_TIMEOUT_MS
        value: 120000
      - key: REDIS_CONNECT_TIMEOUT_MS
        value: 10000
      - key: REDIS_COMMAND_TIMEOUT_MS
        value: 15000
      - key: REDIS_KEEPALIVE_MS
        value: 10000

  - type: static
    name: sitegrade-frontend
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /api/*
        destination: https://sitegrade-backend.onrender.com/api/*
      - type: rewrite
        source: /auth/*
        destination: https://sitegrade-backend.onrender.com/api/auth/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://sitegrade-backend.onrender.com/api
