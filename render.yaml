services:
  - type: web
    name: sitegrade-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: PUPPETEER_CACHE_DIR
        value: ./.cache/puppeteer
      - key: CLIENT_URL
        value: https://sitegrade-frontend.onrender.com
      - key: PUBLIC_APP_URL
        value: https://sitegrade-frontend.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRATION
        value: 15m
      - key: JWT_REFRESH_EXPIRATION
        value: 7d
      - key: GEMINI_API_KEY
        sync: false
      - key: SCREENSHOTS_DIR
        value: ./screenshots
      - key: RUN_ANALYSIS_WORKER_IN_API
        value: true
      - key: RUN_SCHEDULE_WORKER_IN_API
        value: true

  - type: static
    name: sitegrade-frontend
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /api/*
        destination: https://sitegrade-backend.onrender.com/api/*
      - type: rewrite
        source: /auth/*
        destination: https://sitegrade-backend.onrender.com/api/auth/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://sitegrade-backend.onrender.com/api
